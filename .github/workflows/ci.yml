name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/landing/package-lock.json

      - name: Install dependencies
        working-directory: frontend/landing
        run: npm ci

      - name: Build frontend
        working-directory: frontend/landing
        run: npm run build
